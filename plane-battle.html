<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10182b;
    font-family: "Yu Gothic", "Meiryo", "MS PGothic", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #fff;
  }

  .game { display: flex; flex-direction: column; }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #1b2940;
    border-radius: 10px 10px 0 0;
    font-size: 16px;
  }
  .hud b { font-size: 20px; color: #ffd23e; }
  .lives { color: #ff6b6b; letter-spacing: 2px; }
  .power { font-size: 13px; color: #9fe6ff; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }

  .stage { position: relative; }
  canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(8, 14, 30, 0.78);
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: 44px;
    letter-spacing: 6px;
    color: #ffd23e;
    text-shadow: 0 3px 0 #7a5c00;
  }
  .overlay.lose h1 { color: #ff5b5b; text-shadow: 0 3px 0 #6b1d1d; }
  .overlay .desc { font-size: 15px; line-height: 2; color: #cfd8ea; }
  .overlay .desc b { color: #fff; }
  .overlay button {
    font-size: 18px;
    font-family: inherit;
    font-weight: bold;
    padding: 12px 28px;
    background: #ffd23e;
    color: #5c4700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .overlay button:hover { filter: brightness(1.12); }
</style>
</head>
<body>
  <div class="game">
    <div class="hud">
      <span>Score <b id="score">0</b></span>
      <span class="power" id="power"></span>
      <span class="lives" id="lives">Lives ♥♥♥</span>
    </div>
    <div class="stage">
      <canvas id="game" width="400" height="600"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlayTitle">SKY FIGHTER</h1>
        <div class="desc" id="desc"></div>
        <button id="startBtn">START</button>
      </div>
    </div>
  </div>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const powerEl = document.getElementById('power');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const descEl = document.getElementById('desc');
  const startBtn = document.getElementById('startBtn');

  const rand = (a, b) => a + Math.random() * (b - a);

  // —— 定数 ——
  const PLAYER_SPEED = 245;
  const BULLET_SPEED = 430;
  const FIRE_INTERVAL = 0.16;
  const MAX_LIVES = 3;

  // —— ボス・強化アイテム 定数 ——
  const BOSS_FIRST_SCORE = 15000;  // 最初のボス戦の開始スコア
  const BOSS_INTERVAL0 = 50;       // 2体目以降の出現間隔の基準（秒）
  const BOSS_INTERVAL_ADD = 5;     // ボス撃破ごとに間隔を伸ばす秒数
  const BOSS_INTERVAL_MAX = 70;    // 出現間隔の上限（秒）
  const BOSS_HP0 = 90;             // ボスHP（ボス撃破ごとに増加）
  const BOSS_SCORE0 = 3000;        // ボス撃破スコア
  const BOSS_ENTER_Y = 92;         // ボスの停止位置
  const BOSS_RADIUS = 34;
  const ITEM_DROP_CHANCE = 0.07;   // 敵機撃破時アイテムドロップ率
  const MAX_WEAPON = 5;            // 武器の最大レベル
  const ITEM = {
    power:  { label: 'POWER UP',    color: '#ffe27a', icon: 'P',  dur: 0 },
    shield: { label: 'SHIELD',      color: '#7dff9e', icon: 'S',  dur: 10 },
    heal:   { label: 'HP RESTORE',  color: '#ff7fb0', icon: 'HP', dur: 0 },
  };
  // 武器レベル (1..MAX_WEAPON)：角度 / 横ずれ / 射撃間隔倍率（anglesとoffsetsは同数要素）
  const WEAPON = {
    1: { angles: [0],                 offsets: [0],         interval: 1.00 },
    2: { angles: [0, 0],              offsets: [-7, 7],     interval: 1.00 },
    3: { angles: [0, 0],              offsets: [-8, 8],     interval: 0.75 },
    4: { angles: [-0.14, 0, 0.14],    offsets: [0, 0, 0],   interval: 0.75 },
    5: { angles: [-0.16, 0, 0.16],    offsets: [-4, 0, 4],  interval: 0.58 },
  };

  // —— 状態 ——
  let state = 'ready';            // ready | playing | over
  let score = 0, lives = MAX_LIVES, elapsed = 0;
  let player, bullets, ebullets, enemies, particles, popups, stars;
  let keys = {}, firing = false, fireTimer = 0, spawnTimer = 0, invuln = 0;
  let boss = null, bossCount = 0, bossNextScore = BOSS_FIRST_SCORE, bossNextAt = 0;
  let items = [], wlevel = 1, shield = 0;
  let rings = [], smokes = [], shake = 0, flashA = 0;

  // 星フィールド
  stars = [];
  for (let i = 0; i < 80; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: rand(0.6, 2.2) });

  // —— 敵機タイプ定義 ——
  // fighter: 素早く直進・射撃なし / weaver: 蛇行・射撃なし
  // shooter: 自機を狙って撃つ / bomber: 3方向へ散弾
  const TYPE = {
    fighter: { r: 14, score: 100, c1: '#c23a3a', c2: '#ff8a8a', c3: '#8f2424' },
    weaver:  { r: 15, score: 120, c1: '#a44fc4', c2: '#d9a0f0', c3: '#7c2fa0' },
    shooter: { r: 18, score: 200, c1: '#3a7cc2', c2: '#9cc9f0', c3: '#2a5a96' },
    bomber:  { r: 28, score: 320, c1: '#e8623a', c2: '#ffb08a', c3: '#a33a14' },
  };

  function resetGame() {
    score = 0; lives = MAX_LIVES; elapsed = 0;
    player = { x: W / 2, y: H - 70, r: 15, tilt: 0 };
    bullets = []; ebullets = []; enemies = []; particles = []; popups = [];
    firing = false; fireTimer = 0; spawnTimer = 1; invuln = 1.5;
    boss = null; bossCount = 0; bossNextScore = BOSS_FIRST_SCORE; bossNextAt = 0;
    items = []; wlevel = 1; shield = 0;
    rings = []; smokes = []; shake = 0; flashA = 0;
    updatePowerHud();
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = 'Lives ' + '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(MAX_LIVES - Math.max(0, lives));
  }

  function updatePowerHud() {
    const parts = ['PWR Lv.' + wlevel];
    if (shield > 0) parts.push('Shield ' + shield.toFixed(1));
    powerEl.textContent = parts.join('   ');
    powerEl.style.opacity = '1';
  }

  // —— 敵機の出現（時間で種類の比率も変化） ——
  function spawnEnemy() {
    const t = Math.min(1, elapsed / 45);          // 難易度 0→1
    const roll = Math.random();
    let type;
    if (roll < 0.42 - t * 0.14) type = 'fighter'; // 序盤は多い
    else if (roll < 0.66 - t * 0.06) type = 'weaver';
    else if (roll < 0.86) type = 'shooter';
    else type = 'bomber';

    const cf = TYPE[type];
    const f = Math.min(2.2, 1 + elapsed / 40);    // 全体の速度上昇
    const e = { type, x: rand(30, W - 30), y: -36, r: cf.r, score: cf.score, hp: 1, fl: rand(0, 9) };

    if (type === 'fighter') {
      e.vy = 150 * f * rand(0.85, 1.25);
      e.vx = rand(-0.5, 0.5) * 40;
    } else if (type === 'weaver') {
      e.vy = 115 * f; e.vx = 0;
      e.baseX = e.x; e.amp = rand(40, 80); e.freq = rand(1.5, 2.6); e.ph = rand(0, 6.28); e.t = 0;
    } else if (type === 'shooter') {
      e.vy = 95 * f * rand(0.9, 1.15); e.vx = 0;
      e.shootT = rand(0.6, 1.3); e.period = Math.max(0.7, 1.3 - elapsed * 0.01);
    } else { // bomber
      e.vy = 60 * f * rand(0.9, 1.1); e.vx = 0;
      e.shootT = 1.6; e.period = Math.max(1.1, 2.0 - elapsed * 0.012);
    }
    enemies.push(e);
  }

  // —— 敵の攻撃 ——
  function enemyFire(e) {
    if (e.y < 0 || e.y > H * 0.75) return;        // 画面外・下方すぎる時は撃たない
    if (e.type === 'shooter') {                   // 自機を狙って 1発（プラズマ弾）
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 175, vy: Math.sin(a) * 175, r: 4, kind: 'shot' });
      particles.push({ x: e.x + Math.cos(a) * 14, y: e.y + Math.sin(a) * 14, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, life: 0.09, t: 0, c: '#ffb36b', r: 2.6 });
    } else if (e.type === 'bomber') {             // 下方向に 3方向散布（重砲弾）
      for (const d of [-0.28, 0, 0.28]) {
        ebullets.push({ x: e.x, y: e.y, vx: Math.sin(d) * 140, vy: Math.cos(d) * 140, r: 5, kind: 'blast', ph: rand(0, 6.28) });
      }
      particles.push({ x: e.x, y: e.y - 4, vx: rand(-8, 8), vy: -14, life: 0.1, t: 0, c: '#ffdf6b', r: 3 });
    }
  }
  function explode(x, y, scale) {
    // 火花
    const pal = ['#ffd23e', '#ff8c2e', '#ff5b5b', '#fff6c4'];
    for (let i = 0; i < Math.round(16 * scale); i++) {
      const a = rand(0, Math.PI * 2), s = rand(60, 260) * scale;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), t: 0, c: pal[i % 4], r: rand(2, 5) * scale });
    }
    // 炎の残り火（重力で落下）
    for (let i = 0; i < Math.round(7 * scale); i++) {
      const a = rand(0, Math.PI * 2), s = rand(26, 130) * scale;
      particles.push({ x, y, vx: Math.cos(a) * s * 0.5, vy: Math.sin(a) * s * 0.5, life: rand(0.45, 0.85), t: 0, c: '#ff7a2e', r: rand(3, 6) * scale, g: 1 });
    }
    // 衝撃波リング
    rings.push({ x, y, r: Math.max(3, 5 * scale), vr: (200 + rand(0, 140)) * Math.max(1, scale), life: 0.3, t: 0, color: '255,210,62', lw: Math.min(5, 2 + scale * 1.5) });
    rings.push({ x, y, r: Math.max(2, 3 * scale), vr: (110 + rand(0, 90)) * scale, life: 0.45, t: 0, color: '255,255,255', lw: Math.min(3, 1 + scale) });
    // スモーク（大型爆発のみ）
    if (scale >= 1.0) {
      for (let i = 0; i < Math.round(3 * scale); i++) {
        smokes.push({ x: x + rand(-9, 9), y: y + rand(-7, 7), vx: rand(-16, 16), vy: rand(-24, -8), r: rand(6, 10) * scale, dr: rand(16, 30) * scale, life: rand(0.5, 0.95), t: 0 });
      }
    }
    // 画面効果
    shake = Math.min(14, shake + 3 * Math.sqrt(scale) + 1);
    if (scale >= 2.2) flashA = Math.min(0.35, flashA + 0.12 + (scale - 2) * 0.05);
  }

  function addPopup(x, y, text, color) {
    popups.push({ x, y, text, t: 0.8, color: color || '#ffd23e' });
  }

  function updateDifficultyAndSpawn(dt) {
    if (boss) return;   // ボス戦中は通常の敵は出現しない
    spawnTimer -= dt;
    if (spawnTimer <= 0 && enemies.length < 14) {
      spawnEnemy();
      spawnTimer = Math.max(0.28, 1.5 - elapsed * 0.03);
    }
  }

  // —— アイテム ——
  function itemEntity(type, x, y) {
    return {
      type, x, y,
      baseX: x,
      t: 0, freq: rand(2, 3.2), amp: rand(20, 42),
      vy: rand(70, 95), r: 13,
    };
  }
  function pickItemType() {
    // 重み付き抽選（HP満タン時は回復を避ける）
    let pool = [['power', 46], ['shield', 30], ['heal', 24]];
    if (lives >= MAX_LIVES) pool = pool.filter(([t]) => t !== 'heal');
    const total = pool.reduce((s, [, w]) => s + w, 0);
    let roll = rand(0, total);
    for (const [t, w] of pool) { roll -= w; if (roll <= 0) return t; }
    return pool[0][0];
  }
  function dropItemAt(x, y, type) {
    const t = type || pickItemType();
    const it = itemEntity(t, x, y);
    it.x = Math.max(it.r + 6, Math.min(W - it.r - 6, it.x));
    it.baseX = it.x;
    items.push(it);
  }
  function maybeDropItem(x, y) {
    if (boss || Math.random() > ITEM_DROP_CHANCE) return;
    dropItemAt(x, y);
  }
  function dropBossItems(bx, by) {
    for (let i = 0; i < 2; i++) {
      let pool = ['power', 'shield'];
      if (lives < MAX_LIVES && Math.random() < 0.45) pool.push('heal');
      const t = pool[Math.floor(Math.random() * pool.length)];
      dropItemAt(bx + rand(-24, 24), by + 24, t);
    }
  }
  function applyItem(it) {
    const cf = ITEM[it.type];
    if (it.type === 'heal') {
      if (lives >= MAX_LIVES) { score += 500; addPopup(it.x, it.y, 'SCORE +500', cf.color); updateHud(); }
      else { lives++; updateHud(); addPopup(it.x, it.y, 'HP RESTORED!', cf.color); }
    } else if (it.type === 'power') {
      if (wlevel >= MAX_WEAPON) {
        score += 500; addPopup(it.x, it.y, 'MAX! +500', cf.color); updateHud();
      } else {
        wlevel++; addPopup(it.x, it.y, 'WEAPON Lv.' + wlevel + '!', cf.color);
        updatePowerHud();
      }
    } else {
      shield = cf.dur; addPopup(it.x, it.y, cf.label + '！', cf.color);
    }
  }

  // —— 被弾処理（シールド対応） ——
  function playerHit(explodeScale) {
    invuln = Math.max(invuln, 0.5);
    if (shield > 0) {
      shield = 0;
      addPopup(player.x, player.y - 24, 'BLOCKED!', ITEM.shield.color);
      explode(player.x, player.y, 0.7);
      return false;
    }
    explode(player.x, player.y, explodeScale || 1.2);
    lives--;
    updateHud();
    if (lives <= 0) { endGame(); return true; }
    // 被弾で武器が1段階下がる（最低 Lv.1）
    if (wlevel > 1) {
      wlevel--;
      addPopup(player.x, player.y - 30, 'POWER DOWN!', '#ffffff');
      updatePowerHud();
    }
    invuln = 2;
    return false;
  }

  // —— ボス ——
  function spawnBoss() {
    bossCount++;
    const maxHp = BOSS_HP0 + (bossCount - 1) * 45;
    boss = {
      x: W / 2, y: -70,
      hp: maxHp, maxHp, r: BOSS_RADIUS,
      vx: (Math.random() < 0.5 ? -1 : 1) * 72,
      vy: 95,
      phase: 'enter', targetY: BOSS_ENTER_Y,
      t: 0, fireT: 1.0, pattern: 0, flash: 0,
    };
    // ボスに集中できるよう通常の敵・敵弾を一掃
    enemies = [];
    ebullets = [];
    addPopup(W / 2, 170, 'BOSS INCOMING!', '#ff5b5b');
  }
  function bossFire() {
    const frac = Math.max(0, boss.hp) / boss.maxHp;
    const bx = boss.x, by = boss.y;
    const sp = 115 + (1 - frac) * 55;           // HPが少ないほど弾速UP
    if (boss.pattern === 0) {
      // 自機を狙う 3連針弾
      const a = Math.atan2(player.y - by, player.x - bx);
      for (const d of [-0.16, 0, 0.16]) {
        ebullets.push({ x: bx, y: by, vx: Math.cos(a + d) * sp, vy: Math.sin(a + d) * sp, r: 4, kind: 'needle' });
      }
    } else if (boss.pattern === 1) {
      // 円形弾幕（回転菱形）
      const n = 10 + Math.floor((1 - frac) * 4);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + boss.t;
        ebullets.push({ x: bx, y: by, vx: Math.cos(a) * sp * 0.8, vy: Math.sin(a) * sp * 0.8, r: 4.5, kind: 'orb', rot: rand(0, Math.PI) });
      }
    } else {
      // 下方扇状弾（大型紫弾）
      const n = 5 + Math.floor((1 - frac) * 2);
      for (let i = -Math.floor(n / 2); i <= Math.floor(n / 2); i++) {
        const a = (i / n) * 1.7;
        ebullets.push({ x: bx, y: by, vx: Math.sin(a) * sp * 0.85, vy: Math.cos(a) * sp * 0.85, r: 4.5, kind: 'shell' });
      }
    }
  }
  function updateBoss(dt) {
    if (!boss) return;
    boss.t += dt;
    if (boss.flash > 0) boss.flash -= dt;

    if (boss.phase === 'enter') {
      boss.y += boss.vy * dt;
      if (boss.y >= boss.targetY) { boss.y = boss.targetY; boss.phase = 'fight'; }
    } else {
      // 左右移動
      boss.x += boss.vx * dt;
      if (boss.x < 42) { boss.x = 42; boss.vx = Math.abs(boss.vx); }
      if (boss.x > W - 42) { boss.x = W - 42; boss.vx = -Math.abs(boss.vx); }

      // HPが低いほど攻撃間隔が短くなる
      const frac = Math.max(0, boss.hp) / boss.maxHp;
      boss.fireT -= dt;
      if (boss.fireT <= 0) {
        bossFire();
        boss.pattern = (boss.pattern + 1) % 3;
        boss.fireT = 1.35 * (0.55 + 0.75 * frac) * rand(0.8, 1.15);
      }
    }

    // 自機と接触（突入中も当たる）
    if (invuln <= 0 && Math.hypot(boss.x - player.x, boss.y - player.y) < boss.r + player.r) {
      if (playerHit(1.4)) return;
    }
  }
  function bossDefeat() {
    const b = boss;
    boss = null;
    const pts = BOSS_SCORE0 + (bossCount - 1) * 1500;
    score += pts;
    addPopup(b.x, b.y - 26, 'BOSS DOWN!', '#ff5b5b');
    addPopup(b.x, b.y + 8, '+' + pts, '#ffd23e');
    explode(b.x, b.y, 2.6);
    for (let i = 0; i < 3; i++) explode(b.x + rand(-24, 24), b.y + rand(-18, 18), 1.2);
    ebullets = [];
    updateHud();
    dropBossItems(b.x, b.y);
    // 次のボスは時間ベースで呼ぶ（撃破間隔は少しずつ伸びる）
    bossNextAt = elapsed + Math.min(BOSS_INTERVAL_MAX, BOSS_INTERVAL0 + bossCount * BOSS_INTERVAL_ADD);
  }

  // —— 更新 ——
  function update(dt) {
    elapsed += dt;
    // ボス出現：1体目はスコア、2体目以降は時間で（武器強化で頻度が変わらない）
    if (!boss) {
      if (bossCount === 0) {
        if (score >= bossNextScore) spawnBoss();
      } else if (elapsed >= bossNextAt) {
        spawnBoss();
      }
    }
    updateDifficultyAndSpawn(dt);
    updateBoss(dt);
    if (invuln > 0) invuln -= dt;

    // プレイヤー移動
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    player.x = Math.max(18, Math.min(W - 18, player.x + dx * PLAYER_SPEED * dt));
    player.y = Math.max(40, Math.min(H - 24, player.y + dy * PLAYER_SPEED * dt));
    // 移動方向に合わせてバンク（飛行機の傾き）
    player.tilt += (0.28 * dx - player.tilt) * Math.min(1, 10 * dt);

    // 発射（武器レベルで弾道と射速が変化）
    fireTimer -= dt;
    const wcfg = WEAPON[wlevel] || WEAPON[1];
    const interval = FIRE_INTERVAL * wcfg.interval;
    if (firing && fireTimer <= 0) {
      fireTimer = interval;
      for (let i = 0; i < wcfg.angles.length; i++) {
        const a = wcfg.angles[i];
        bullets.push({ x: player.x + wcfg.offsets[i] + Math.sin(a) * 4, y: player.y - 22, vx: Math.sin(a) * BULLET_SPEED, vy: -Math.cos(a) * BULLET_SPEED });
      }
      // マズルフラッシュ
      particles.push({ x: player.x, y: player.y - 26, vx: rand(-12, 12), vy: -24, life: 0.06, t: 0, c: '#cfeaff', r: 2.2 });
    }

    // 自弾
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += (b.vx || 0) * dt;
      b.y += (b.vy || -BULLET_SPEED) * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) {
        bullets.splice(i, 1);
      } else if (boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.r + 5) {
        bullets.splice(i, 1);
        boss.hp--; boss.flash = 0.06;
        if (boss.hp <= 0) bossDefeat();
      }
    }

    // 敵機
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.type === 'weaver') {                 // 蛇行移動
        e.t += dt;
        e.x = e.baseX + Math.sin(e.t * e.freq + e.ph) * e.amp;
        e.y += e.vy * dt;
        e.x = Math.max(e.r, Math.min(W - e.r, e.x));
      } else {
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx); }
        if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx); }
      }
      if (e.y > H + 40) { enemies.splice(i, 1); continue; }

      // 敵の攻撃タイマー
      if (e.shootT !== undefined) {
        e.shootT -= dt;
        if (e.shootT <= 0) { enemyFire(e); e.shootT = e.period; }
      }

      // 自弾との衝突
      let destroyed = false;
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 5) {
          bullets.splice(j, 1);
          e.hp--;
          if (e.hp <= 0) {
            score += e.score;
            addPopup(e.x, e.y, '+' + e.score);
            explode(e.x, e.y, e.r / 16);
            maybeDropItem(e.x, e.y);
            enemies.splice(i, 1);
            updateHud();
            destroyed = true;
          }
          break;
        }
      }
      if (destroyed) continue;

      // 自機との衝突
      if (invuln <= 0 && Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) {
        enemies.splice(i, 1);
        if (playerHit(1.4)) return;
      }
    }

    // 敵弾
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;

      // 撃ち落とせるのは爆撃機の砲弾だけ（他の弾は避けるしかない）
      if (b.kind === 'blast') {
        let gone = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (Math.hypot(b.x - bullets[j].x, b.y - bullets[j].y) < b.r + 6) {
            bullets.splice(j, 1); gone = true; break;
          }
        }
        if (gone) {
          // 撃ち落とし：小さく爆ぜる
          rings.push({ x: b.x, y: b.y, r: 3, vr: 96, life: 0.22, t: 0, color: '255,190,90', lw: 2 });
          particles.push({ x: b.x, y: b.y, vx: rand(-44, 44), vy: rand(-70, -8), life: 0.2, t: 0, c: '#ffb36b', r: 2.4 });
          particles.push({ x: b.x, y: b.y, vx: rand(-32, 32), vy: rand(-16, 42), life: 0.18, t: 0, c: '#ffdf6b', r: 2 });
          ebullets.splice(i, 1);
          continue;
        }
      }

      if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) { ebullets.splice(i, 1); continue; }

      // 自機に命中
      if (invuln <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r) {
        ebullets.splice(i, 1);
        if (playerHit()) return;
      }
    }

    // 星・粒子・ポップアップ
    for (const s of stars) { s.y += 40 * dt; if (s.y > H + 4) s.y = -4; }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.g) p.vy += 240 * dt;                 // 残り火は重力落下
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      if (p.t >= p.life) particles.splice(i, 1);
    }
    // 画面効果（シェイク・フラッシュ減衰）
    shake *= Math.pow(0.05, dt);
    if (shake < 0.15) shake = 0;
    flashA = Math.max(0, flashA - 1.5 * dt);
    // 衝撃波リング
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.t += dt; rg.r += rg.vr * dt; rg.vr *= 0.9;
      if (rg.t >= rg.life) rings.splice(i, 1);
    }
    // スモーク
    for (let i = smokes.length - 1; i >= 0; i--) {
      const s = smokes[i];
      s.t += dt; s.r += s.dr * dt; s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= 0.98; s.vy = s.vy * 0.98 - 4 * dt;
      if (s.t >= s.life) smokes.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const f = popups[i];
      f.t -= dt; f.y -= 36 * dt;
      if (f.t <= 0) popups.splice(i, 1);
    }

    // シールド残り時間
    if (shield > 0) shield -= dt;
    updatePowerHud();

    // アイテムの移動・回収
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.t += dt;
      it.x = Math.max(it.r, Math.min(W - it.r, it.baseX + Math.sin(it.t * it.freq) * it.amp));
      it.y += it.vy * dt;
      if (it.y > H + 30) { items.splice(i, 1); continue; }
      if (Math.hypot(it.x - player.x, it.y - player.y) < it.r + player.r + 2) {
        applyItem(it);
        items.splice(i, 1);
      }
    }
  }

      ctx.fillStyle = 'rgba(8,14,30,0.7)';
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = cf.color; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = cf.color;
      ctx.font = 'bold 14px "Yu Gothic", "Meiryo", sans-serif';
      ctx.fillText(cf.icon, it.x, it.y + 0.5);
    }
    ctx.textBaseline = 'alphabetic';
  }
  function drawShield() {
    const blink = shield < 2 && Math.floor(shield * 10) % 2 === 0;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 9, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(120,255,160,' + (blink ? 0.15 : 0.35) + ')';
    ctx.fill();
    ctx.strokeStyle = blink ? 'rgba(160,255,200,0.4)' : 'rgba(160,255,200,0.85)';
    ctx.lineWidth = 2; ctx.stroke();
  }
  function drawBossWarning() {
    if (Math.floor(boss.t * 6) % 2 === 0) {
      ctx.font = 'bold 20px "Yu Gothic", "Meiryo", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3b3b';
      ctx.fillText('WARNING! BOSS APPROACHING!', W / 2, 130);
    }
  }

  // 自弾：エネルギーボルト（光暈 + グラデ弾芯）
  function drawPlayerBullets() {
    for (const b of bullets) {
      ctx.fillStyle = 'rgba(110,200,255,0.28)';
      ctx.beginPath(); ctx.ellipse(b.x, b.y - 3, 4.5, 12, 0, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createLinearGradient(0, b.y - 13, 0, b.y + 3);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#4fa5ff');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(b.x, b.y - 13); ctx.lineTo(b.x - 3, b.y + 3); ctx.lineTo(b.x + 3, b.y + 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillRect(b.x - 1, b.y - 11, 2, 5);
    }
  }

  // 敵弾：機種ごとの弾種
  function drawEnemyBullets() {
    for (const b of ebullets) {
      const k = b.kind || 'shot';
      if (k === 'shot') {
        // 狙撃機：プラズマ球
        ctx.fillStyle = 'rgba(255,70,70,0.28)';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e03a3a';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb36b';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.25, 0, Math.PI * 2); ctx.fill();
      } else if (k === 'blast') {
        // 爆撃機：重砲弾 + 炎の尾
        ctx.fillStyle = '#7e2000';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffdf6b';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.3, 0, Math.PI * 2); ctx.fill();
        const fl = 4 + Math.sin(elapsed * 50 + (b.ph || 0)) * 2;
        ctx.fillStyle = 'rgba(255,170,60,0.8)';
        ctx.beginPath(); ctx.moveTo(b.x - 2.5, b.y + b.r - 2); ctx.lineTo(b.x, b.y + b.r + fl); ctx.lineTo(b.x + 2.5, b.y + b.r - 2); ctx.closePath(); ctx.fill();
      } else if (k === 'needle') {
        // ボス狙撃：細長い針弾（進行方向へ回転）
        const ang = Math.atan2(b.vy, b.vx);
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang);
        ctx.fillStyle = 'rgba(255,60,60,0.3)';
        ctx.beginPath(); ctx.moveTo(-2, 4); ctx.lineTo(0, 8); ctx.lineTo(2, 4); ctx.closePath(); ctx.fill();
        const g = ctx.createLinearGradient(-6, 0, 7, 0);
        g.addColorStop(0, '#ff5b5b');
        g.addColorStop(1, '#ffd9a0');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(0, -2.2); ctx.lineTo(7, 0); ctx.lineTo(0, 2.2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(6, 0, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (k === 'orb') {
        // ボス円形弾幕：回転する菱形
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot || 0);
        ctx.fillStyle = 'rgba(150,255,220,0.25)';
        ctx.beginPath(); ctx.moveTo(0, -b.r - 3); ctx.lineTo(b.r + 3, 0); ctx.lineTo(0, b.r + 3); ctx.lineTo(-b.r - 3, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#5af2c0';
        ctx.beginPath(); ctx.moveTo(0, -b.r); ctx.lineTo(b.r, 0); ctx.lineTo(0, b.r); ctx.lineTo(-b.r, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e8fff8';
        ctx.beginPath(); ctx.moveTo(0, -b.r * 0.5); ctx.lineTo(b.r * 0.5, 0); ctx.lineTo(0, b.r * 0.5); ctx.lineTo(-b.r * 0.5, 0); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        // ボス扇状弾：紫色の大型砲弾
        ctx.fillStyle = 'rgba(190,120,255,0.25)';
        ctx.beginPath(); ctx.arc(b.x - 1, b.y + 1, b.r + 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#7a3fc4';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d9a0f0';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.28, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // 爆発の層：スモーク + 衝撃波リング
  function drawEffects() {
    for (const s of smokes) {
      ctx.globalAlpha = (1 - s.t / s.life) * 0.5;
      ctx.fillStyle = '#2a3344';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    for (const rg of rings) {
      const a = 1 - rg.t / rg.life;
      ctx.strokeStyle = 'rgba(' + rg.color + ',' + a.toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.5, rg.lw * a);
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }

  function draw() {
    drawBg();

    if (boss) drawBossBar();

    // 画面シェイク（世界レイヤーを揺らす）
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    // 敵機
    for (const e of enemies) drawEnemy(e);

    // ボス
    if (boss) drawBoss();

    // 自弾 / 敵弾
    drawPlayerBullets();
    drawEnemyBullets();

    // アイテム
    drawItems();

    // 爆発（火花・残り火）
    ctx.globalAlpha = 1;
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.g) {                      // 炎の残り火は周囲が発光
        ctx.globalAlpha = (1 - p.t / p.life) * 0.22;
        ctx.fillStyle = '#ffd984';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.9, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    drawEffects();

    // 得点ポップアップ
    ctx.font = 'bold 15px "Yu Gothic", "Meiryo", sans-serif';
    ctx.textAlign = 'center';
    for (const f of popups) {
      ctx.globalAlpha = Math.min(1, f.t / 0.4);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // ボス接近警告
    if (boss && boss.phase === 'enter') drawBossWarning();

    if (state !== 'over') {
      if (shield > 0) drawShield();
      drawPlayer();
    }

    // 爆発フラッシュ（全体）
    if (flashA > 0.01) {
      ctx.fillStyle = 'rgba(255,255,255,' + flashA.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }
  // —— メインループ ——
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (state === 'playing') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // —— UI ——
  function showOverlay(lose) {
    overlay.classList.add('show');
    overlay.classList.toggle('lose', lose);
    overlayTitle.textContent = lose ? 'GAME OVER' : 'SKY FIGHTER';
    startBtn.textContent = lose ? 'PLAY AGAIN' : 'START';
    descEl.innerHTML = lose
      ? 'Final Score: <em style="color:#ffd23e;font-size:28px">' + score + '</em><br>Take to the skies and try again!'
      : 'Use <b>← → ↑ ↓</b> or <b>W A S D</b> to move and <b>SPACE</b> to shoot<br>Score points by shooting down enemies! Reach <b>15,000</b> to call in the first <b>BOSS</b> — later bosses arrive on a timer.<br>Grab <b>P</b> to upgrade your weapon <b>(Lv.1–5)</b> — losing a life drops your level!';
  }

  function startGame() {
    resetGame();
    state = 'playing';
    overlay.classList.remove('show');
  }

  startBtn.addEventListener('click', () => { startBtn.blur(); startGame(); });

  // キー入力（同時押し対応）
  document.addEventListener('keydown', (e) => {
    if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Space') firing = true;
    if (e.code === 'Enter' && state !== 'playing') startGame();
  });
  document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.code === 'Space') firing = false;
  });

  resetGame();
  showOverlay(false);
  requestAnimationFrame(loop);
</script>
</body>
</html>
